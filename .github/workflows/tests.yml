name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    name: Tests (Laravel ${{ matrix.laravel }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - laravel: 12
            testbench: ^10.0
            coverage: true
          - laravel: 13
            testbench: ^11.0
            coverage: false
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite
          coverage: ${{ matrix.coverage && 'pcov' || 'none' }}

      - uses: ramsey/composer-install@v3

      - run: composer update -W --with orchestra/testbench:${{ matrix.testbench }} --no-interaction --prefer-dist

      - run: ./vendor/bin/phpunit ${{ matrix.coverage && '--coverage-clover coverage.xml' || '' }}

      - uses: codecov/codecov-action@v5
        if: matrix.coverage
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  mutation-testing:
    name: Mutation Testing
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite
          coverage: pcov

      - uses: ramsey/composer-install@v3

      - run: composer update -W --with orchestra/testbench:^10.0 --no-interaction --prefer-dist

      - run: ./vendor/bin/infection --threads=max

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infection-report
          path: infection.html
